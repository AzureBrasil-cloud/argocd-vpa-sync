name: chart-publish

# Publishes deploy/helm/argocd-vpa-sync as an OCI artifact to Docker Hub
# (oci://registry-1.docker.io/azurebrasil/argocd-vpa-sync), like
# git-monitor: it reuses the DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets from
# docker-publish.yml and needs no GitHub Pages or write permissions.
#
# Bump Chart.yaml's `version` to release. A version that is already
# published is never overwritten (OCI tags are mutable): the push is skipped
# with a warning instead.

on:
  push:
    branches: [master]
    paths:
      - "deploy/helm/argocd-vpa-sync/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART_DIR: deploy/helm/argocd-vpa-sync
  REGISTRY: oci://registry-1.docker.io/azurebrasil

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - run: helm lint "$CHART_DIR"

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - id: check
        name: Skip versions that are already published
        run: |
          name=$(yq '.name' "$CHART_DIR/Chart.yaml")
          version=$(yq '.version' "$CHART_DIR/Chart.yaml")
          if helm show chart "$REGISTRY/$name" --version "$version" >/dev/null 2>&1; then
            echo "::warning::$name $version is already published, not overwriting it - bump version in $CHART_DIR/Chart.yaml to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push chart
        if: steps.check.outputs.publish == 'true'
        run: |
          helm package "$CHART_DIR" -d dist
          helm push dist/*.tgz "$REGISTRY"
