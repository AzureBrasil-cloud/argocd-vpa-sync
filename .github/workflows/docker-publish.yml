name: docker-publish

# Builds and pushes the image to Docker Hub (azurebrasil/argocd-vpa-updater).
#
#   push to master -> :edge
#   tag v1.2.3     -> :1.2.3, :1.2 and :latest
#
# Requires two repository (or organization) secrets:
#   DOCKERHUB_USERNAME - a Docker Hub username with push access to the repo
#   DOCKERHUB_TOKEN    - a Docker Hub access token (not the account password)

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE_NAME: azurebrasil/argocd-vpa-updater

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - id: build-args
        run: |
          echo "version=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-args.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-args.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
