{{- if .Values.listenerSet.enabled }}
{{- if not (.Values.listenerSet.parentRef).name }}
{{- fail "listenerSet.parentRef.name is required when listenerSet.enabled is true" }}
{{- end }}
{{- if not .Values.listenerSet.listeners }}
{{- fail "listenerSet.listeners is required when listenerSet.enabled is true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "argocd-vpa-sync.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-vpa-sync.labels" . | nindent 4 }}
    {{- with .Values.listenerSet.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.listenerSet.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRef:
    {{- toYaml .Values.listenerSet.parentRef | nindent 4 }}
  listeners:
    {{- toYaml .Values.listenerSet.listeners | nindent 4 }}
{{- end }}
