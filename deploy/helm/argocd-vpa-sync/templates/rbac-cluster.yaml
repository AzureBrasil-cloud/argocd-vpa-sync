{{- /*
Cluster-wide, read-only access to the resource types this controller
observes, plus status writes on its own VpaGitOpsBinding CRD. It creates,
modifies and owns no VPA, Application or workload. Deployments,
StatefulSets and CronJobs are "get" only: the dashboard reads one named
workload at a time, uncached (see cmd/argocd-vpa-updater/main.go).
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argocd-vpa-sync.fullname" . }}
  labels:
    {{- include "argocd-vpa-sync.labels" . | nindent 4 }}
rules:
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argocd-vpa-updater.argoproj.io"]
    resources: ["vpagitopsbindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argocd-vpa-updater.argoproj.io"]
    resources: ["vpagitopsbindings/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "argocd-vpa-sync.fullname" . }}
  labels:
    {{- include "argocd-vpa-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "argocd-vpa-sync.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "argocd-vpa-sync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
