{{- /*
Read access to Secrets in Argo CD's namespace, so the write-back worker can
use the repository credential Secrets Argo CD already manages (labeled
argocd.argoproj.io/secret-type: repository|repo-creds).

KNOWN LIMITATION: RBAC cannot scope Secret reads by label, so this grants
read access to every Secret in that namespace. The code only reads the
labeled credential Secrets and never logs or returns their content.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "argocd-vpa-sync.fullname" . }}-repo-creds
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "argocd-vpa-sync.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "argocd-vpa-sync.fullname" . }}-repo-creds
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "argocd-vpa-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "argocd-vpa-sync.fullname" . }}-repo-creds
subjects:
  - kind: ServiceAccount
    name: {{ include "argocd-vpa-sync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
