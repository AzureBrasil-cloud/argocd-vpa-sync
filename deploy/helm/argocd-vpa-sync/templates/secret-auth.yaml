{{- /*
Admin credentials, in the style of Argo CD's argocd-secret: the password is
only stored as a bcrypt/argon2id hash (admin.password), next to the optional
session signing key (server.secretkey). Only rendered when the login is
configured through values rather than auth.existingSecret.
*/ -}}
{{- if and .Values.auth.admin.passwordHash (not .Values.auth.existingSecret) }}
{{- with .Values.auth.sessionSigningKey }}
{{- if lt (len .) 32 }}
{{- fail "auth.sessionSigningKey must be at least 32 characters" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argocd-vpa-sync.authSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-vpa-sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin.password: {{ .Values.auth.admin.passwordHash | quote }}
  {{- with .Values.auth.sessionSigningKey }}
  server.secretkey: {{ . | quote }}
  {{- end }}
{{- end }}
