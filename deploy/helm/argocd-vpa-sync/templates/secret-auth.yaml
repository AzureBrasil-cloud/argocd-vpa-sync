{{- /*
Admin credentials, in the style of Argo CD's argocd-secret: the password is
only stored as a bcrypt/argon2id hash (admin.password), next to the session
signing key (server.secretkey).

Values that aren't set are generated on install and carried over on every
upgrade via `lookup`:
  - no auth.admin.passwordHash: a random password, bcrypt-hashed here, whose
    plain text goes to <fullname>-initial-admin-secret (like Argo CD's
    argocd-initial-admin-secret). Setting passwordHash later deletes it.
  - no auth.sessionSigningKey: a random signing key.
`lookup` returns nothing under `helm template` / Argo CD, so use
auth.existingSecret (or set both values) there -- see README.
*/ -}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $secretName := include "argocd-vpa-sync.authSecretName" . }}
{{- $initialName := include "argocd-vpa-sync.initialAdminSecretName" . }}
{{- $current := (lookup "v1" "Secret" .Release.Namespace $secretName).data | default dict }}
{{- $initial := (lookup "v1" "Secret" .Release.Namespace $initialName).data | default dict }}

{{- $signingKey := "" }}
{{- if .Values.auth.sessionSigningKey }}
{{- if lt (len .Values.auth.sessionSigningKey) 32 }}
{{- fail "auth.sessionSigningKey must be at least 32 characters" }}
{{- end }}
{{- $signingKey = .Values.auth.sessionSigningKey | b64enc }}
{{- else if index $current "server.secretkey" }}
{{- $signingKey = index $current "server.secretkey" }}
{{- else }}
{{- $signingKey = randAlphaNum 48 | b64enc }}
{{- end }}

{{- $passwordHash := "" }}
{{- $initialPassword := "" }}
{{- if .Values.auth.admin.passwordHash }}
{{- $passwordHash = .Values.auth.admin.passwordHash | b64enc }}
{{- else if and (index $current "admin.password") (index $initial "password") }}
{{- $passwordHash = index $current "admin.password" }}
{{- $initialPassword = index $initial "password" }}
{{- else }}
{{- $generated := randAlphaNum 16 }}
{{- $passwordHash = bcrypt $generated | b64enc }}
{{- $initialPassword = $generated | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-vpa-sync.labels" . | nindent 4 }}
type: Opaque
data:
  admin.password: {{ $passwordHash }}
  server.secretkey: {{ $signingKey }}
{{- if $initialPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $initialName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-vpa-sync.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $initialPassword }}
{{- end }}
{{- end }}
