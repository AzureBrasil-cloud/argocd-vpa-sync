image:
  repository: azurebrasil/argocd-vpa-updater
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Only 1 is supported: the write-back worker has no leader election, so
# several replicas would race to commit the same selections.
replicaCount: 1

argocd:
  # Namespace Argo CD runs in. The Applications referenced by
  # VpaGitOpsBindings, and the repository credential Secrets used to push to
  # Git (argocd.argoproj.io/secret-type: repository|repo-creds), are read
  # from here.
  namespace: argocd

ssh:
  # ConfigMap (key ssh_known_hosts, in the release namespace) with the SSH
  # host keys git trusts when pushing over SSH. The default reuses Argo CD's
  # own, which only works when the chart is installed in Argo CD's namespace.
  knownHostsConfigMap: argocd-ssh-known-hosts-cm
  # Host keys to trust instead, in ssh_known_hosts format. When set, the
  # chart creates its own ConfigMap and ignores knownHostsConfigMap.
  extraKnownHosts: ""

state:
  # Secret (in the release namespace) the controller keeps its operational
  # state in: pending selections and write-back results. The controller
  # creates it on first use, so it is not managed by Helm/Argo CD and
  # survives uninstall. Defaults to <fullname>-state.
  secretName: ""

writeback:
  # How often the write-back worker checks for newly queued selections.
  pollIntervalSeconds: 20

# Optional admin login, in the style of Argo CD's admin user. With neither
# auth.admin.passwordHash nor auth.existingSecret set there is no login: the
# dashboard -- including the actions that queue Git commits -- is open to
# anyone who can reach the Service.
auth:
  admin:
    username: admin
    # bcrypt ($2a$/$2b$/$2y$) or argon2id ($argon2id$) hash of the admin
    # password. Setting it turns the login on. E.g.:
    #   htpasswd -nbBC 10 "" 'my-password' | tr -d ':\n'
    #   argocd account bcrypt --password 'my-password'
    #   echo -n 'my-password' | argon2 "$(openssl rand -hex 16)" -id -e
    passwordHash: ""
  # Key used to sign session tokens (at least 32 characters). When empty the
  # pod picks a random one at startup, so a restart logs everyone out.
  sessionSigningKey: ""
  # Use an existing Secret (in the release namespace) instead, which also
  # turns the login on. Keys:
  #   admin.password    - the bcrypt/argon2id password hash (required)
  #   server.secretkey  - the session signing key (optional, >= 32 characters)
  existingSecret: ""
  sessionTTL: 24h
  # Secure flag on the session cookie. Browsers only send it over HTTPS
  # (plain-HTTP http://localhost port-forwards are the exception), so turn
  # it off only when serving the dashboard over plain HTTP on another host.
  cookieSecure: true

serviceAccount:
  create: true
  # Defaults to <fullname>.
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: vpa-updater.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: vpa-updater-tls
  #    hosts:
  #      - vpa-updater.example.com

networkPolicy:
  # Restricts ingress to the HTTP port. Egress (Kubernetes API, Git) is not
  # restricted.
  enabled: false
  # Peers allowed to reach the HTTP port (NetworkPolicyPeer list). Empty
  # allows every source, e.g.:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  from: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Extra environment variables for the container.
extraEnv: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
