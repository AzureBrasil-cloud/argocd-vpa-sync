{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "argocd-vpa-updater.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-vpa-updater.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "argocd-vpa-updater.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
