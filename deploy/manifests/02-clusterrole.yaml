# Cluster-wide, read-only access to the resource types this controller
# observes, plus read/status-write on its own VpaGitOpsBinding CRD (which can
# exist in any application namespace, so it needs the same cluster scope as
# VPAs and Applications). It creates, modifies and owns no VPA, Application,
# Pod, Deployment or StatefulSet -- see the RBAC section of README.md for the
# full rationale.
#
# The Deployment/StatefulSet/CronJob grant below is "get" only, deliberately
# not "list"/"watch": the dashboard reads one named workload at a time (to
# show the container resources.requests currently running, compared against
# the VPA recommendation -- see internal/workloadresources), it never
# enumerates them, and the client that performs these reads has caching
# disabled for these types for exactly this reason (see cmd/argocd-vpa-updater
# main.go) so no cluster-wide watch RBAC is needed either.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-vpa-updater
rules:
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argocd-vpa-updater.argoproj.io"]
    resources: ["vpagitopsbindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argocd-vpa-updater.argoproj.io"]
    resources: ["vpagitopsbindings/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-vpa-updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-vpa-updater
subjects:
  - kind: ServiceAccount
    name: argocd-vpa-updater
    namespace: argocd-vpa-updater
