# Read/write access scoped to exactly one Secret: the operational state
# document (see internal/statestore). No other Secret in this namespace is
# accessible through this Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-vpa-updater-state
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-vpa-updater-state"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-vpa-updater-state
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-vpa-updater-state
subjects:
  - kind: ServiceAccount
    name: argocd-vpa-updater
    namespace: argocd
