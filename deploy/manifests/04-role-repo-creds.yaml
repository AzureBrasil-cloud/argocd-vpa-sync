# Grants read access to Secrets in the Argo CD namespace, so
# internal/credentials.ArgoCDSecretProvider can find repository credential
# Secrets Argo CD itself already manages (labeled
# argocd.argoproj.io/secret-type: repository|repo-creds).
#
# KNOWN LIMITATION: Kubernetes RBAC cannot restrict list/watch/get on Secrets
# by label at the API server level, so this Role technically grants read
# access to every Secret in the Argo CD namespace, not only credential ones.
# The application code only ever reads the labeled repository-credential
# Secrets (see internal/credentials/argocd_secret_provider.go) and never logs
# or returns Secret content, but this is still broader than ideal from a
# pure RBAC standpoint. Tightening this (e.g. a dedicated read-proxy, or an
# admission/authorization webhook such as Kyverno/OPA scoping it further) is
# a follow-up, not part of this MVP.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-vpa-updater-repo-creds
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-vpa-updater-repo-creds
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-vpa-updater-repo-creds
subjects:
  - kind: ServiceAccount
    name: argocd-vpa-updater
    namespace: argocd-vpa-updater
