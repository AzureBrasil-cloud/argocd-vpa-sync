# Bootstraps the state Secret with a valid, empty document so
# StateStore.Get never needs special not-found handling in the primary path.
# SecretStore only needs `get`/`update` RBAC (see 03-role-state.yaml) because
# this manifest, not the controller, is what creates it.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-vpa-updater-state
  namespace: argocd-vpa-updater
type: Opaque
stringData:
  state.json: |
    {"schemaVersion":1,"updatedAt":"1970-01-01T00:00:00Z","pendingSelections":[],"operations":{}}
