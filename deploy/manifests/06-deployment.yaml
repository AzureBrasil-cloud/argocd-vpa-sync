apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-vpa-updater
  namespace: argocd-vpa-updater
  labels:
    app.kubernetes.io/name: argocd-vpa-updater
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-vpa-updater
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-vpa-updater
    spec:
      serviceAccountName: argocd-vpa-updater
      containers:
        - name: argocd-vpa-updater
          image: docker.io/azurebrasil/argocd-vpa-updater:v0.5.5
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: STATE_SECRET_NAMESPACE
              value: "argocd-vpa-updater"
            - name: STATE_SECRET_NAME
              value: "argocd-vpa-updater-state"
            - name: ARGOCD_NAMESPACE
              value: "argocd"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
