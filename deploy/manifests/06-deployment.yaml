apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-vpa-updater
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-vpa-updater
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-vpa-updater
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-vpa-updater
    spec:
      serviceAccountName: argocd-vpa-updater
      containers:
        - name: argocd-vpa-updater
          image: docker.io/azurebrasil/argocd-vpa-updater:v1.0.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: STATE_SECRET_NAMESPACE
              value: "argocd"
            - name: STATE_SECRET_NAME
              value: "argocd-vpa-updater-state"
            - name: ARGOCD_NAMESPACE
              value: "argocd"
            - name: SSH_KNOWN_HOSTS
              value: "/app/config/ssh/ssh_known_hosts"
          volumeMounts:
            - name: ssh-known-hosts
              mountPath: /app/config/ssh
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        # Reuses Argo CD's own SSH host key allowlist so git writeback trusts
        # the same hosts Argo CD itself does (git@ssh.dev.azure.com among
        # them), instead of maintaining a second copy in a repo Secret. Same
        # volume/mount convention as the argocd-image-updater Helm chart
        # (argo-helm), which mounts this same ConfigMap the same way.
        - name: ssh-known-hosts
          configMap:
            name: argocd-ssh-known-hosts-cm
            optional: true
