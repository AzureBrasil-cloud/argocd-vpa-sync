# TEMPORARY TEST OVERLAY -- installs argocd-vpa-updater directly into the
# `argocd` namespace instead of its own dedicated namespace (see
# ../../README notes / repo README for why a dedicated namespace is the
# recommended long-term layout). Use this only for manual smoke-testing
# before the project is onboarded as a proper Argo CD Application; once
# that happens, prefer the base manifests in deploy/manifests/ (their own
# namespace, no manual kubectl apply).
#
# Does NOT manage the `argocd` Namespace object itself -- it already exists
# and is owned by other tooling.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-vpa-updater
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-vpa-updater
rules:
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argocd-vpa-updater.argoproj.io"]
    resources: ["vpagitopsbindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argocd-vpa-updater.argoproj.io"]
    resources: ["vpagitopsbindings/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-vpa-updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-vpa-updater
subjects:
  - kind: ServiceAccount
    name: argocd-vpa-updater
    namespace: argocd
---
# Read/write scoped to exactly one Secret (the operational state document).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-vpa-updater-state
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-vpa-updater-state"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-vpa-updater-state
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-vpa-updater-state
subjects:
  - kind: ServiceAccount
    name: argocd-vpa-updater
    namespace: argocd
---
# Same-namespace now that the controller itself runs in `argocd` -- no
# cross-namespace RoleBinding needed for this overlay (see the base
# manifests' 04-role-repo-creds.yaml for the cross-namespace version and its
# RBAC-label-filtering caveat, which still applies here).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-vpa-updater-repo-creds
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-vpa-updater-repo-creds
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-vpa-updater-repo-creds
subjects:
  - kind: ServiceAccount
    name: argocd-vpa-updater
    namespace: argocd
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-vpa-updater-state
  namespace: argocd
type: Opaque
stringData:
  state.json: |
    {"schemaVersion":1,"updatedAt":"1970-01-01T00:00:00Z","pendingSelections":[],"operations":{}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-vpa-updater
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-vpa-updater
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-vpa-updater
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-vpa-updater
    spec:
      serviceAccountName: argocd-vpa-updater
      containers:
        - name: argocd-vpa-updater
          image: docker.io/azurebrasil/argocd-vpa-updater:v0.5.5
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: STATE_SECRET_NAMESPACE
              value: "argocd"
            - name: STATE_SECRET_NAME
              value: "argocd-vpa-updater-state"
            - name: ARGOCD_NAMESPACE
              value: "argocd"
            - name: SSH_KNOWN_HOSTS
              value: /etc/ssh-known-hosts/ssh_known_hosts
          volumeMounts:
            - name: ssh-known-hosts
              mountPath: /etc/ssh-known-hosts
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        # Reuses Argo CD's own SSH known_hosts ConfigMap (same namespace in
        # this overlay) instead of maintaining a separate copy -- go-git's
        # SSH transport already honors SSH_KNOWN_HOSTS by default.
        - name: ssh-known-hosts
          configMap:
            name: argocd-ssh-known-hosts-cm
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-vpa-updater
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-vpa-updater
spec:
  selector:
    app.kubernetes.io/name: argocd-vpa-updater
  ports:
    - name: http
      port: 8080
      targetPort: http
